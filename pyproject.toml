readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "loguru>=0.7.3",
    "pipecat-ai[cartesia,deepgram,elevenlabs,groq,langchain,silero,webrtc]>=1.8.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "websockets>=17.0.1",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.22",
    "qdrant-client[fastembed]>=1.14.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.2",
    "reportlab>=5.0.1",
]
